<div class="container-fluid">
    <div class="login-page">
        <div class="login-card">
            <div class="login-header">
            <h2>Registracija</h2>
            <a class="small-link" routerLink="/login">Imate nalog?</a>
            </div>

            <form class="login-form">
                <label for="username">Korisničko ime</label>
                <input type="text" placeholder="Unesite korisničko ime" id="username" name="username" [(ngModel)]="username" required>

                <label for="email">Email</label>
                <input type="email" placeholder="Unesite Email" id="email" name="email" [(ngModel)]="email" required>

                <label for="password">Šifra</label>
                <input type="password" placeholder="Unesite šifru" name="password" (keyup)="unlock()" [(ngModel)]="password" required>
                
                <!--<label for="password" *ngIf="!isLetter()" style="color: red;">•Password must start with a letter</label>
                <label for="password" *ngIf="!hasLength()" style="color: red;">•Password must contain between 8 and 16 letters</label>
                <label for="password" *ngIf="!containsSpecialChars(password)" style="color: red;">•Password must contain special characters</label>
                <label for="password" *ngIf="!hasANumber()" style="color: red;">•Password must contain a number</label>
                <label for="password" *ngIf="!hasACapital()" style="color: red;">•Password must contain at least one capital letter</label>-->

                <label for="confirm_password">Potvrdite šifru</label>
                <input type="password" placeholder="Potvrdite šifru" name="confirm_password" [(ngModel)]="confirm_password" required>

                <label for="confirm_password" *ngIf="!isSameAsPassword()" style="color: red;">•Šifre se moraju poklapati</label>

                <div class="form-actions">
                    <button class="primary" (click)="register()" [disabled]="isLoading">
                        <span *ngIf="!isLoading">Kreiraj nalog</span>
                        <span *ngIf="isLoading">Kreiranje u toku...</span>
                    </button>
                </div>
                <div *ngIf="errorMessage" style="color: #b00020; margin-top:8px">{{ errorMessage }}</div>
            </form>
        </div>
    </div>
</div>
