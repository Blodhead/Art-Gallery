<div class="container-fluid">
    <div class="login-page">
        <div class="login-card">
            <div class="login-header">
            <h2>Register</h2>
            <a class="small-link" routerLink="/login">Already have an account?</a>
            </div>

            <form class="login-form">
                <label for="username">Username</label>
                <input type="text" placeholder="Enter Username" id="username" name="username" [(ngModel)]="username" required>

                <label for="mail">Email</label>
                <input type="email" placeholder="Enter Email" id="mail" name="mail" [(ngModel)]="mail" required>

                <label for="password">Password</label>
                <input type="password" placeholder="Enter Password" name="password" (keyup)="unlock()" [(ngModel)]="password" required>
                
                <label for="password" *ngIf="!isLetter()" style="color: red;">•Password must start with a letter</label>
                <label for="password" *ngIf="!hasLength()" style="color: red;">•Password must contain between 8 and 16 letters</label>
                <label for="password" *ngIf="!containsSpecialChars(password)" style="color: red;">•Password must contain special characters</label>
                <label for="password" *ngIf="!hasANumber()" style="color: red;">•Password must contain a number</label>
                <label for="password" *ngIf="!hasACapital()" style="color: red;">•Password must contain at least one capital letter</label>

                <label for="confirm_password">Confirm Password</label>
                <input type="password" placeholder="Confirm Password" name="confirm_password" [(ngModel)]="confirm_password" required>

                <label for="confirm_password" *ngIf="!isSameAsPassword()" style="color: red;">•Passwords must match</label>

                <div class="form-actions">
                    <button class="primary" (click)="register()" [disabled]="isLoading">
                        <span *ngIf="!isLoading">Create account</span>
                        <span *ngIf="isLoading">Creating...</span>
                    </button>
                </div>
                <div *ngIf="errorMessage" style="color: #b00020; margin-top:8px">{{ errorMessage }}</div>
            </form>
        </div>
    </div>
</div>
