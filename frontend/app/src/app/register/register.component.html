<div class="body container-fluid">
    <div class="row">
        <div class="col-4">&nbsp;</div>
        <div class="col-4">

            <ul class="nav nav-tabs" style="width: fit-content; padding-top: 40px; border-bottom: black;">
                <li class="nav-item tabs" style="background-color: transparent;">
                  <button class=" rounded-top" style="padding: 9px; top: 13px; position: relative; margin: 0px; background-color: rgb(28, 108, 16);"  routerLink="../login">Login</button>
                </li> 
                <li class="nav-item tabs tabbs">
        
                  <button class=" rounded-top btn-xs" style="margin: 0px; background-color: rgb(19,98,7);" routerLink="../register">Register</button>
                </li>
              </ul>

            <form class="page scrollbar scrollbar-default" style="width: 100%; height: 420px; display:flex; align-items:center; justify-content:center;">
                <div class="container simple-register" style="max-width:420px; width:100%;">

                    <label for="username"><b>Username</b></label>
                    <input type="text" placeholder="Enter Username" name="username" [(ngModel)]="username" required>

                    <label for="password"><b>Password</b></label>
                    <input type="password" placeholder="Enter Password" name="password" (keyup)="unlock()" [(ngModel)]="password" required>
                    <label for="password" *ngIf="!isLetter()" style="color: red;">•Password must start with a letter</label>
                    <label for="password" *ngIf="!hasLength()" style="color: red;">•Password must contain between 8 and 16 letters</label>
                    <label for="password" *ngIf="!containsSpecialChars(password)" style="color: red;">•Password must contain special characters</label>
                    <label for="password" *ngIf="!hasANumber()" style="color: red;">•Password must contain a number</label>
                    <label for="password" *ngIf="!hasACapital()" style="color: red;">•Password must contain at least one capital letter</label>

                    <label for="password"><b>Confirm Password</b></label>
                    <input type="password" placeholder="Confirm Password" name="confirm_password" [(ngModel)]="confirm_password" required>

                    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:12px;">
                        <button class="primary" (click)="register()">Create account</button>
                        <a routerLink="/login" style="font-size:0.9em; color:#777;">Already have an account?</a>
                    </div>

                </div>

            </form>

        </div>
        <div class="col-4">&nbsp;</div>
    </div>
</div>
