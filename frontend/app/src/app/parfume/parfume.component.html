<div class="container-fluid">

    <div class="row bg" style="border-bottom: 3px solid black;">
        <div class="col-2">&nbsp;</div>
        <div class="col-8 intro middle">

            <div class="row">
                <div class="col-12 middle" style="height: 100px;">

                </div>


            </div>
        </div>
        <div class="col-2">&nbsp;</div>
    </div>

    <div class="row">
        <div class="col-3 intro">
            &nbsp;
        </div>
        <div class="col-6 intro middle" style="justify-content: center !important;">

            <table>
                <tr>
                    <td>
                        <h6>Search by:</h6>
                    </td>
                    <td><input type="text" placeholder="name..." (keyup)="search(str1)" [(ngModel)]="str1"></td>
                    <td>
                        <h6>or/and</h6>
                    </td>
                    <td><input type="text" placeholder="location..." (keyup)="search(str2)" [(ngModel)]="str2">
                    </td>
                </tr>
                <tr *ngIf="searchFlag==true">
                    <td>
                        <h6>Sort by:</h6>
                    </td>

                    <td>
                        <button *ngIf="toggle1 == true" class="btn btn-success btn-xs"
                            style="margin: 0px; background-color: rgb(19,98,7);" (click)="sortName()">Name ↑</button>
                        <button *ngIf="toggle1 == false" class="btn btn-success btn-xs"
                            style="margin: 0px; background-color: rgb(19,98,7);" (click)="sortName()">Name ↓</button>
                        <button *ngIf="toggle2 == true" class="btn btn-success btn-xs"
                            style="margin: 0px; background-color: rgb(19,98,7);" (click)="sortDate()">Date ↑</button>
                        <button *ngIf="toggle2 == false" class="btn btn-success btn-xs"
                            style="margin: 0px; background-color: rgb(19,98,7);" (click)="sortDate()">Date ↓</button>
                    </td>

                </tr>
            </table>

        </div>
                <div class="col-3 intro">
            &nbsp;
        </div>
    </div>


    <div class="row">
        <div class="col-1">&nbsp;</div>

        <div class="col-9">
            <div class="parfume-grid">
                <app-parfume-details *ngFor="let parfume of filtered_parfumes; let i = index;" [myParfumeDetail]="parfume"></app-parfume-details>
            </div>
        </div>

        <div class="col-1 ">
            &nbsp;
            <!--
            <table>
                <th> <h4>Top 5:</h4> <hr/></th>
                <tr>
                    <ol type="1">
                        <h6><li *ngFor="let i of top5;">{{i}}</li></h6>
                    </ol>
                </tr>
            </table>
            -->
        </div>
    </div>

</div>
