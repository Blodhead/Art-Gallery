<div class="container-fluid">

    <div class="row bg">
        <div class="col-2">&nbsp;</div>
        <div class="col-8 intro middle">

            <div class="row">
                <div class="col-12 middle" style="height: 100px;">

                </div>


            </div>
        </div>
        <div class="col-2">&nbsp;</div>
    </div>


    <div class="row" style="margin-top: 2rem;">
        <!-- Sidebar: on small screens it should take full width and stack above content -->
        <div class="col-xl-3 col-lg-4 col-md-4 col-sm-12 col-12 pe-lg-4 mb-4 mb-lg-0 filter-sidebar">
            <div class="finest-filet-text">
                Finest Miris, najpovoljniji online shop za veliki izbor originalnih parfema, testera i poklon setova u Srbiji.
            </div>
            <div class="filter-box">
                <h4 class="filter-title" (click)="toggleFilters()">Filteri
                    <span class="arrow" [class.open]="filtersVisible">&#9662;</span>
                </h4>
                <div class="filter-content" *ngIf="filtersVisible">
                    <div class="filter-group">
                        <label for="nameFilter">Naziv</label>
                        <input id="nameFilter" type="text" class="filter-input" placeholder="Pretraži..."
                            [(ngModel)]="nameFilter" (keyup)="onNameFilterChange(nameFilter)">
                    </div>
                    <div class="filter-group">
                        <label for="sexFilter">Pol</label>
                        <select id="sexFilter" class="filter-input" [(ngModel)]="sexFilter" (change)="onSexFilterChange(sexFilter)">
                            <option value="Sve">Sve</option>
                            <option value="Muški">Muški</option>
                            <option value="Ženski">Ženski</option>
                            <option value="Uniseks">Uniseks</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="priceSlider">Opseg cena</label>
                        <div class="price-slider">
                            <div #priceSlider class="slider-box"></div>
                        </div>

                    </div>
                    <div class="filter-group">
                        <label>Sortiraj</label>
                        <button *ngIf="toggle2 == true" class="sort-btn" (click)="sortPrice()">Cena ↑</button>
                        <button *ngIf="toggle2 == false" class="sort-btn" (click)="sortPrice()">Cena ↓</button>
                        <button *ngIf="toggle1 == true" class="sort-btn" (click)="sortName()">Naziv ↑</button>
                        <button *ngIf="toggle1 == false" class="sort-btn" (click)="sortName()">Naziv ↓</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-xl-9 col-lg-8 col-md-8 col-sm-12 col-12">
            <div #parfumeGrid class="parfume-grid">
                <app-parfume-details *ngFor="let parfume of displayed_parfumes; let i = index;"
                    [myParfumeDetail]="parfume"></app-parfume-details>
            </div>
        </div>
        <div class="pagination-controls"
            style="margin: 2rem 0; display: flex; justify-content: center; align-items: center; gap: 1rem;">
            <button class="btn btn-outline-secondary" (click)="prevPage()" [disabled]="currentPage === 1"> &lt; </button>
            <span>{{currentPage}} of {{totalPages}}</span>
            <button class="btn btn-outline-secondary" (click)="nextPage()"
                [disabled]="currentPage === totalPages"> &gt; </button>
        </div>
    </div>

</div>
