<div class="shippment-grid">
  <div class="shippment-cart">
    <h3>Orders ({{ totalQty() }} items)</h3>
    <div *ngIf="entries().length == 0">Your cart is empty.</div>
    <div class="cart-list">
      <div *ngFor="let e of entries()" class="cart-item">
        <app-parfume-details [myParfumeDetail]="e.item"></app-parfume-details>
      </div>
    </div>
  </div>

  <div class="shippment-form">
    <h2>Shipping information</h2>
    <div class="form-grid">
      <div class="form-field">
        <label>First name</label>
        <input [(ngModel)]="firstName" />
      </div>
      <div class="form-field">
        <label>Last name</label>
        <input [(ngModel)]="lastName" />
      </div>
      <div class="form-field">
        <label>Phone</label>
        <input [(ngModel)]="phone" />
      </div>

      <div class="form-field">
        <label>Street</label>
        <input [(ngModel)]="street" />
      </div>
      <div class="form-field">
        <label>Number</label>
        <input [(ngModel)]="number" />
      </div>
      <div class="form-field">
        <label>House number</label>
        <input [(ngModel)]="houseNumber" />
      </div>

      <div class="form-field">
        <label>City</label>
        <input [(ngModel)]="city" />
      </div>
      <div class="form-field">
        <label>Postal code</label>
        <input [(ngModel)]="postalCode" />
      </div>
    </div>

    <div class="form-actions">
      <button class="btn btn-primary" (click)="save()">Save & Continue</button>
    </div>
  </div>
</div>
