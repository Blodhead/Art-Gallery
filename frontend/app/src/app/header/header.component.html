<header class="main-header" [class.hidden]="isHidden">
  <div class="header-left">
    <span class="logo" routerLink="">FinestMiris</span>
  </div>
  <nav class="header-nav">
    <a *ngIf="type=='admin'" class="nav-link" routerLink="admin">Admin</a>
    <a *ngIf="type=='organizer'" class="nav-link" routerLink="user_organizer">Profile</a>
    <a *ngIf="type=='participant'" class="nav-link" routerLink="user">Profile</a>
    <a *ngIf="type=='participant'" class="nav-link" routerLink="MyParfumes">My Parfumes</a>
    <a *ngIf="type=='participant'" class="nav-link" routerLink="/admin/edit_parfume">Become Organizer</a>
  </nav>

  <div class="header-actions header-actions-mobile" style="position: relative;">
    <h4 class="filter-title" (click)="toggleVisible()">
      <svg [class.open]="filtersVisible" xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor"
        class="bi bi-person-circle" viewBox="0 0 16 16">
        <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0" />
        <path fill-rule="evenodd"
          d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1" />
      </svg>
    </h4>

    <div class="collapse" *ngIf="filtersVisible">
      <a *ngIf="!hasToken" class="nav-link" (click)="toggleVisible()" routerLink="login">Login</a>
      <a *ngIf="hasToken" class="nav-link cart-btn position-relative" (click)="toggleVisible()" routerLink="cart">
        <svg xmlns="http://www.w3.org/2000/svg" height="1em" viewBox="0 0 576 512">
          <path
            d="M24 0C10.7 0 0 10.7 0 24S10.7 48 24 48H69.5c3.8 0 7.1 2.7 7.9 6.5l51.6 271c6.5 34 36.2 58.5 70.7 58.5H488c13.3 0 24-10.7 24-24s-10.7-24-24-24H199.7c-11.5 0-21.4-8.2-23.6-19.5L170.7 288H459.2c32.6 0 61.1-21.8 69.5-53.3l41-152.3C576.6 57 557.4 32 531.1 32h-411C111 12.8 91.6 0 69.5 0H24zM131.1 80H520.7L482.4 222.2c-2.8 10.5-12.3 17.8-23.2 17.8H161.6L131.1 80zM176 512a48 48 0 1 0 0-96 48 48 0 1 0 0 96zm336-48a48 48 0 1 0 -96 0 48 48 0 1 0 96 0z"
            fill="currentColor"></path>
        </svg>
        <span class="cart-badge" *ngIf="cartCount > 0">{{ cartCount }}</span>
      </a>
      <a *ngIf="hasToken" class="nav-link" (click)="toggleVisible()" routerLink="verify">Change Password</a>
      <a *ngIf="hasToken" class="nav-link link" (click)="logout()" (click)="toggleVisible()">Logout</a>
      <a *ngIf="!hasToken" class="nav-link" (click)="toggleVisible()" routerLink="register">Register</a>
    </div>
  </div>

  <div class="header-actions header-actions-desktop" style="position: relative;">
    <a *ngIf="!hasToken" class="nav-link" routerLink="login">Login</a>
    <a *ngIf="hasToken" class="nav-link cart-btn position-relative" routerLink="cart">
      <svg xmlns="http://www.w3.org/2000/svg" height="1em" viewBox="0 0 576 512">
        <path
          d="M24 0C10.7 0 0 10.7 0 24S10.7 48 24 48H69.5c3.8 0 7.1 2.7 7.9 6.5l51.6 271c6.5 34 36.2 58.5 70.7 58.5H488c13.3 0 24-10.7 24-24s-10.7-24-24-24H199.7c-11.5 0-21.4-8.2-23.6-19.5L170.7 288H459.2c32.6 0 61.1-21.8 69.5-53.3l41-152.3C576.6 57 557.4 32 531.1 32h-411C111 12.8 91.6 0 69.5 0H24zM131.1 80H520.7L482.4 222.2c-2.8 10.5-12.3 17.8-23.2 17.8H161.6L131.1 80zM176 512a48 48 0 1 0 0-96 48 48 0 1 0 0 96zm336-48a48 48 0 1 0 -96 0 48 48 0 1 0 96 0z"
          fill="currentColor"></path>
      </svg>
      <span class="cart-badge" *ngIf="cartCount > 0">{{ cartCount }}</span>
    </a>
    <a *ngIf="hasToken" class="nav-link" routerLink="verify">Change Password</a>
    <a *ngIf="hasToken" class="nav-link link" (click)="logout()">Logout</a>
    <a *ngIf="!hasToken" class="nav-link" routerLink="register">Register</a>
  </div>

</header>
