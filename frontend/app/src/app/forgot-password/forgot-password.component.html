<div class="forgot-password">
  <h2>Forgot password</h2>

  <div *ngIf="step === 'email'">
    <label>Email</label>
    <input [(ngModel)]="email" type="email" class="form-control" />
    <button class="btn btn-primary mt-2" (click)="sendCode()" [disabled]="loading">Send code</button>
    <div *ngIf="message" class="text-success mt-2">{{message}}</div>
    <div *ngIf="error" class="text-danger mt-2">{{error}}</div>
  </div>

  <div *ngIf="step === 'code'">
    <p>{{message}}</p>
    <label>Verification code</label>
    <input [(ngModel)]="code" type="text" class="form-control" />
    <button class="btn btn-primary mt-2" (click)="verify()" [disabled]="loading">Verify code</button>
    <div *ngIf="error" class="text-danger mt-2">{{error}}</div>
  </div>

  <div *ngIf="step === 'reset'">
    <label>New password</label>
    <input [(ngModel)]="new_password" type="password" class="form-control" />
    <label class="mt-2">Confirm password</label>
    <input [(ngModel)]="confirm_password" type="password" class="form-control" />
    <button class="btn btn-success mt-2" (click)="reset()" [disabled]="loading">Set new password</button>
    <div *ngIf="error" class="text-danger mt-2">{{error}}</div>
  </div>

  <div *ngIf="step === 'done'">
    <div class="alert alert-success">Password updated. Redirecting to login...</div>
  </div>
</div>
